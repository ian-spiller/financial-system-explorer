.rrb-short-pair .rrb-number{margin:26px 0 12px;font-size:35px}
.rrb-inflation>.rrb-number{color:#f0c67c}
.rrb-track>.rrb-op{align-self:start;margin-top:102px}
.rrb-op{align-self:center;display:grid;place-items:center;font-size:22px;line-height:1;color:#a7bfd0;font-weight:400}
.rrb-short-total{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;min-height:70px;padding:10px 8px;border:1px solid #76648f;border-radius:8px;background:#282b4055;color:#d3c1ef}
.rrb-short-total>span{font-size:11px;line-height:1.4}.rrb-short-total strong{margin-left:7px;font-size:22px;font-weight:650;white-space:nowrap}
.rrb-short-total>button{border:0;background:none;padding:0;color:#dac6fa;font:inherit;font-size:11px;line-height:1.4;cursor:pointer}
.rrb-term{background:#202d40;border-color:#667395}.rrb-term>.rrb-number{font-size:29px;color:#cbb9ed}
.rrb-base{background:#1b3a4d;border-color:#6b9ab7}.rrb-base>.rrb-number{color:#b9dfff;font-size:40px}.rrb-base-label{margin-top:auto;padding-top:14px;color:#b9d3e6;font-size:10px;line-height:1.5}
.rrb-branches{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;min-width:0;padding:0}

.rrb-equity h5{color:#dec8ff}.rrb-branch-base{font-size:11px;line-height:1.4;color:#b8cfe0;margin:0 0 7px}
.rrb-branches .rrline-risk-row{padding:7px 8px;min-height:32px}.rrb-branches .rrline-risk-row>span{font-size:11px}.rrb-branches .rrline-risk-row>strong{font-size:13px}
.rrb-branches .rrb-output{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:7px;min-height:79px;width:100%;margin:7px 0 0;padding:10px 4px;border-radius:7px;background:#21496580;border:1px solid #6da4ce55;font:inherit;cursor:pointer;text-align:center;color:#cbe7fd}
.rrb-branches .rrb-output{margin-top:auto}.rrb-output>span{font-size:11px;line-height:1.4}.rrb-output>strong{font-size:30px;font-weight:700;line-height:1.1;letter-spacing:-.03em;white-space:nowrap}
.rrb-equity .rrb-output{background:#60478455;border-color:#a17bc055;color:#dec8ff}
.rrb-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;padding-top:10px;border-top:1px solid #627c8e44}
.rrb-footer>span{color:#adc4d5;font-size:10px;line-height:1.5}.rrb-footer>.rrline-company{width:auto;margin:0;font-size:11px;text-align:right}
@media(max-width:650px){.rrb-track{grid-template-columns:260px 22px 130px 22px 140px 24px 390px;min-width:1088px}.rrb-story .rrline-heading{gap:5px}.rrb-footer{align-items:flex-start;flex-direction:column;gap:8px}.rrb-footer>.rrline-company{text-align:left}}

<script>'use strict';
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const C={money:'#54ddc4',finance:'#81abff',risk:'#fb929b',rules:'#c1a0ff'};
let state={selected:null,flow:null,zoom:1,motion:!matchMedia('(prefers-reduced-motion: reduce)').matches};
let modalReturn=null;
function refs(ids){const seen=new Set();return `<div class="sourcechips">${[...new Set(ids)].filter(id=>{const source=sources[id];if(!source||seen.has(source[1]))return false;seen.add(source[1]);return true}).map(id=>`<a href="${sources[id][1]}" target="_blank" rel="noopener noreferrer">${sources[id][0]} ↗</a>`).join('')}</div>`}

function firmPayoffs(value,debt=80){return{debt:Math.min(value,debt),equity:Math.max(value-debt,0),shortfall:Math.max(debt-value,0)}}
function firmNPV(cashFlow,rate,investment=100){const pv=cashFlow/(1+rate/100);return{pv,npv:pv-investment,projectReturn:(cashFlow/investment-1)*100}}
function equityModel(d,g,r){if(d<0||r<=g||r<=0)throw Error('Required return must exceed growth.');return{value:d/((r-g)/100)}}
function bondTeachingPrice(yieldPercent,years,face=1000,couponPercent=3){const coupon=face*couponPercent/100;const cash=Array.from({length:years},(_,i)=>{const t=i+1,payment=coupon+(t===years?face:0);return{t,payment,pv:payment/(1+yieldPercent/100)**t}});return{price:cash.reduce((sum,c)=>sum+c.pv,0),cash,coupon}}
function householdMoney(n){return Math.round((n+Number.EPSILON)*100)/100}
function householdLoan(type,marketRate,balance=100000,years=20){if(type==='none')return{payment:0,interest:0,principal:0,rate:0,balance:0};const rate=type==='fixed'?3:marketRate,r=rate/1200,months=years*12,payment=r===0?balance/months:balance*r/(1-(1+r)**(-months)),interest=balance*r;return{payment:householdMoney(payment),interest:householdMoney(interest),principal:householdMoney(householdMoney(payment)-householdMoney(interest)),rate,balance}}
function diversificationModel(rho){return 20*Math.sqrt((1+rho)/2)}
function showModal(title){disconnectBankBufferLink();disconnectCentralBankPath();if(!$('#modal').classList.contains('open'))modalReturn=document.activeElement;$('#modaltitle').textContent=title;$('#modal').className='modal open essential-mode';document.body.style.overflow='hidden';$('.modalbox').scrollTop=0}
function showEssential(id){publicationSetRoute(id);essentialView.id=id;showModal(N[id].displayName||N[id].name);$('#essentialBack').hidden=true;$('#modalcontent').innerHTML=essentialContent(id);bindEssential();$('#closeModal').focus()}
function selectNode(id){if(!N[id])return;if(ratesHubState.open)setRatesHubOpen(false);state.selected=['equities','bonds'].includes(id)?'funds':id;state.flow=null;essentialView.fundStep=1;render();showEssential(id)}
function closeModal(){publicationSetRoute('');disconnectBankBufferLink();disconnectCentralBankPath();$('#modal').className='modal';document.body.style.overflow='';$('#essentialBack').hidden=true;if(modalReturn?.isConnected)modalReturn.focus()}
function selectFlow(id){const f=F[id];if(!f)return;publicationSetRoute('flow/'+id);state.selected=null;state.flow=id;render();showModal(f.label);$('#essentialBack').hidden=true;$('#modalcontent').innerHTML=`<section class="es-view"><div class="eyebrow" style="color:${C[f.type]}">${({money:'PAYMENTS AND MONEY',finance:'FINANCING',risk:'RISK TRANSMISSION',rules:'INTEREST-RATE INFLUENCE'})[f.type]}</div><h3 class="es-title">${N[f.a].displayName||N[f.a].name}<br><em>→ ${N[f.b].displayName||N[f.b].name}</em></h3><p>${f.text}</p><p class="es-note">${f.scope==='influence'?'An influence, not a cash payment.':f.scope==='newIssue'?'Arrow: investor → issuer for a new issue. Existing securities trade between investors.':f.scope==='investmentReturn'?'Payments go to the actual security holder; the map shows this investor group.':'Schematic relationship, not a measured flow.'}</p><div class="es-choice"><button data-en-node="${f.a}">${N[f.a].displayName||N[f.a].name} →</button><button data-en-node="${f.b}">${N[f.b].displayName||N[f.b].name} →</button></div><details class="en-sources"><summary>Sources</summary>${refs(f.refs||[])}</details></section>`;$$('[data-en-node]').forEach(b=>b.onclick=()=>selectNode(b.dataset.enNode));$('#closeModal').focus()}
function mapFrameBounds(){
 const focus=mapFocusedLayout();
 if(!focus)return{x:60,y:-16,width:1105,height:726};
 const bottom=Math.max(...Object.values(focus.positions).map(p=>p.y+32),...Object.values(focus.routes).map(r=>r.lane+2))+MAP_SPACING.framePadding;
 return{x:25,y:10,width:1095,height:Math.max(470,bottom-10)};
}
function zoom(d){
 state.zoom=Math.max(1,Math.min(2.6,state.zoom+d));
 const frame=mapFrameBounds(),w=frame.width/state.zoom,h=frame.height/state.zoom,map=$('#map');
 map.setAttribute('viewBox',`${frame.x+(frame.width-w)/2} ${frame.y+(frame.height-h)/2} ${w} ${h}`);
 if(map.style&&typeof map.style.setProperty==='function')map.style.setProperty('--map-aspect',frame.width+' / '+frame.height);
}
function reset(){state.selected=null;state.flow=null;state.zoom=1;setRatesHubOpen(false);render();publicationSetRoute('')}
function mapFocusActor(){return state.selected||(state.flow&&F[state.flow]?F[state.flow].a:null)}
function mapFocusedGroups(){
 const actor=mapFocusActor();if(!actor)return [];
 const relevant=state.flow?[F[state.flow]]:flows.filter(f=>f.a===actor||f.b===actor),groups=new Map();
 for(const f of relevant){const key=[f.a,f.b,f.type].join(':');if(!groups.has(key))groups.set(key,{key,a:f.a,b:f.b,type:f.type,actor,other:f.a===actor?f.b:f.a,flows:[]});groups.get(key).flows.push(f)}
 return [...groups.values()];
}
function mapFocusedLayout(){
 const actor=mapFocusActor();if(!actor)return null;const groups=mapFocusedGroups(),others=[...new Set(groups.map(g=>g.other))].sort((a,b)=>groups.filter(g=>g.other===b).length-groups.filter(g=>g.other===a).length),positions={[actor]:{x:590,y:430}},leftCount=Math.floor(others.length/2),left=others.slice(0,leftCount),right=others.slice(leftCount),ys=n=>n===1?[430]:n===2?[220,640]:[200,430,660];
 for(const [ids,x]of [[left,180],[right,1000]])ids.forEach((id,i)=>positions[id]={x,y:ys(ids.length)[i]});
 const routes={};
 for(const ids of [left,right]){
  const side=ids===left?-1:1,list=ids.flatMap(id=>groups.filter(g=>g.other===id).sort((a,b)=>a.type.localeCompare(b.type)||a.a.localeCompare(b.a)));
  list.forEach((g,rank)=>{const peer=positions[g.other],siblings=list.filter(h=>h.other===g.other),index=siblings.indexOf(g),lane=peer.y+(index-(siblings.length-1)/2)*56,sourceY=430+(rank-(list.length-1)/2)*9,targetY=peer.y+(index-(siblings.length-1)/2)*13,sx=590+side*105,tx=peer.x-side*105,bend=side<0?440:740,near=side<0?295:885,labelX=side<0?365:815;
   const forward=`M${sx} ${sourceY} C${sx+side*16} ${sourceY} ${bend-side*24} ${lane} ${bend} ${lane} H${near} C${near+side*6} ${lane} ${tx-side*4} ${targetY} ${tx} ${targetY}`,reverse=`M${tx} ${targetY} C${tx-side*4} ${targetY} ${near+side*6} ${lane} ${near} ${lane} H${bend} C${bend-side*24} ${lane} ${sx+side*16} ${sourceY} ${sx} ${sourceY}`;
   routes[g.key]={path:g.a===actor?forward:reverse,labelX,lane};
  });
 }
 return {actor,groups,positions,routes};
}
function mapFocusedLabel(g){
 if(state.flow)return g.flows[0].label;
 const labels={
 'households:banks:money':'Deposits &\nrepayments','banks:households:money':'Withdrawals &\npayouts','households:banks:finance':'Bank shares &\nbonds','banks:households:finance':'Household loans',
 'households:firms:money':'Goods & services','firms:households:money':'Wages & investor\npayouts','households:firms:finance':'Direct investing',
 'households:state:money':'Taxes &\ncontributions','state:households:money':'Public & debt\npayments','households:state:finance':'Govt bonds',
 'households:funds:finance':'Fund contributions','funds:households:money':'Fund payouts',
 'banks:firms:finance':'Loans &\ncorporate bonds','firms:banks:money':'Deposits & debt\npayments','banks:firms:rules':'Loan rates &\nterms',
 'banks:state:finance':'Govt bonds','state:banks:money':'Interest &\nrepayments','funds:banks:finance':'Bank shares &\nbonds','banks:funds:money':'Security payments',
 'cb:banks:money':'Reserves','cb:banks:rules':'Policy-rate\neffects','firms:state:money':'Taxes','state:firms:money':'Public purchases',
 'funds:firms:finance':'Shares &\ncorporate bonds','firms:funds:money':'Dividends & debt\npayments','funds:state:finance':'Govt bonds &\nbills','state:funds:money':'Interest &\nrepayments','cb:funds:rules':'Policy-rate\neffects'
 };
 return labels[g.key]||g.flows[0].label;
}
function mapFocusedCaption(label,x,lane){
 const lines=String(label).replace(/\\n/g,'\n').split(/\r?\n/).flatMap(s=>{const parts=[];let line='';for(const word of s.split(' ')){if(line&&line.length+word.length+1>18){parts.push(line);line=word}else line+=(line?' ':'')+word}if(line)parts.push(line);return parts});
 return mapArrowCaption(lines.join('\n'),x,lane,'above','focus-map-caption');
}
function mapFocusedMarkers(){return '<defs>'+Object.entries(C).map(([kind,colour])=>`<marker id="focus-arrow-${kind}" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" markerWidth="9" markerHeight="7" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="${colour}"/></marker>`).join('')+'</defs>'}
function mapFocusedEdge(g,route){
 const label=mapFocusedLabel(g),names=g.flows.map(f=>f.label).join('; ');

function mapFocusedGuide(){return `<g class="focus-map-back" data-map-back="overview" role="button" tabindex="0" aria-label="Back to the full financial system"><rect x="45" y="30" width="182" height="42" rx="9"/><text x="136" y="57" text-anchor="middle">← Full system</text></g>`}
function showFocusedFlows(key){
 const group=mapFocusedGroups().find(g=>g.key===key);if(!group)return;if(group.flows.length===1){selectFlow(group.flows[0].id);return}
 publicationSetRoute(group.actor);showModal(mapFocusedLabel(group).replace(/\n/g,' '));$('#essentialBack').hidden=true;
 $('#modalcontent').innerHTML=`<section class="es-view"><div class="eyebrow" style="color:${C[group.type]}">${({money:'MONEY FLOWS',finance:'FINANCING',rules:'RATE INFLUENCES'})[group.type]}</div><h3 class="es-title">${N[group.a].displayName||N[group.a].name}<br><em>→ ${N[group.b].displayName||N[group.b].name}</em></h3><div class="focus-flow-list">${group.flows.map(f=>`<button data-focus-flow="${f.id}"><span>${f.label}</span><b aria-hidden="true">↗</b></button>`).join('')}</div></section>`;

}
function render(){

 const visible=state.flow?[F[state.flow]]:flows.filter(f=>state.selected?(f.a===state.selected||f.b===state.selected):f.overview),related=new Set(visible.flatMap(f=>[f.a,f.b]));
 nodes.forEach(n=>{const el=$('#node-'+n.id),sel=(focus?focus.actor:state.selected)===n.id,p=focus?focus.positions[n.id]:n;el.style.display=p?'':'none';if(p)el.setAttribute('transform',`translate(${p.x-100},${p.y-32})`);el.classList.toggle('selected',sel);el.classList.toggle('related',related.has(n.id));el.classList.toggle('dim',!!(state.selected||state.flow)&&!related.has(n.id)&&!sel);el.setAttribute('aria-pressed',sel)});

}

function init(){

const flows=[{"id":"deposit","a":"households","b":"banks","type":"money","label":"Bank deposits","text":"A household deposit is an asset of the household and a liability of the bank. A transfer of an existing deposit does not itself create new money.","overview":1,"refs":["creation"],"scope":"account","overviewLabel":"Deposits"},{"id":"loanH","a":"banks","b":"households","type":"finance","label":"Household loans","text":"A new bank loan normally creates a matching deposit. The household receives an asset and takes on debt.","overview":0,"refs":["creation","capital"],"scope":"loan"},{"id":"consume","a":"households","b":"firms","type":"money","label":"Goods and services","text":"Payment reduces the buyer’s deposit and increases the seller’s deposit. Banks arrange settlement.","overview":0,"refs":["infra","system"],"scope":"payment"},{"id":"wage","a":"firms","b":"households","type":"money","label":"Wages and other payments","text":"Companies pay households from their accounts. A wage payment transfers existing money.","overview":0,"refs":["system","creation"],"scope":"payment"},{"id":"loanF","a":"banks","b":"firms","type":"finance","label":"Business loans","text":"Banks lend for equipment, inventory and other business needs. The loan is a bank asset and company debt.","overview":1,"refs":["creation","capital"],"scope":"loan","overviewLabel":"Business loans"},{"id":"repay","a":"firms","b":"banks","type":"money","label":"Company loan repayments","text":"Principal repayment reduces the loan and deposits in the banking system. Interest is separate income for the bank.","overview":0,"refs":["creation"],"scope":"payment"},{"id":"reserves","a":"cb","b":"banks","type":"money","label":"Central-bank liquidity","text":"Eligible banks can obtain reserves under central-bank terms. Reserves settle payments between banks.","overview":0,"refs":["ecbRates","creation"],"scope":"reserves"},{"id":"rates","a":"cb","b":"banks","type":"rules","label":"Policy-rate transmission","text":"Policy s","b":"households","type":"money","label":"Direct bank-security payments","text":"Households holding bank bonds or shares receive contractual debt payments or approved dividends. These are distinct from payments on deposit accounts.","overview":0,"refs":["bankFunding","stockBasics"],"scope":"investmentReturn"},{"id":"cbPortfolioInfluence","a":"cb","b":"funds","type":"rules","label":"Policy influence on investment values","text":"Policy rates, expectations and other central-bank measures influence market yields and required returns. This changes the valuation of shares and bonds held in portfolios. It is an influence, not a cash payment to funds.","overview":0,"refs":["transmission","yieldCurve","cfaDDM","bondPriceRisk"],"scope":"influence","overviewLabel":"Required returns"},{"id":"governmentBankPayments","a":"state","b":"banks","type":"money","label":"Government payments to bank bondholders","text":"For government bonds held as bank assets, government pays coupons and principal to the bank. These payments are separate from government payments to other debt-holder groups.","overview":0,"refs":["treasuries","govIssue","bankFunding"],"scope":"investmentReturn"},{"id":"companyBankBondPayments","a":"firms","b":"banks","type":"money","label":"Corporate-bond payments to banks","text":"For corporate bonds held by banks, companies pay contractual coupons and principal to those banks. These security payments are separate from repayments on company bank loans.","overview":0,"refs":["corporateDebt","bankFunding"],"scope":"investmentReturn"}];

function companyValueViewModel(m=systemCompanyModel()){
 const assetCents=Math.round(m.project.pv*100),debtCents=Math.round(assetCents*m.debtWeight);
 // Allocate the rounded value of remaining project cash flows, not past investment cost.
 let allocated=0;const projects=[.4,.35,.25].map((weight,i)=>{const cents=i===2?assetCents-allocated:Math.round(assetCents*weight);allocated+=cents;return{name:"Project "+String.fromCharCode(65+i),pv:cents/100}});
 return{...m,assetValueToday:assetCents/100,debtValueToday:debtCents/100,equityValueToday:(assetCents-debtCents)/100,afterTaxDebtRate:m.debtRate*(1-m.tax),investment:100,projects};
}


function companyAnnualCashModel(m=companyValueViewModel()){
 const initialInvestment=100,initialCapex=80,initialWorkingCapital=20,debt=initialInvestment*m.debtWeight,initialEquity=initialInvestment-debt;
 let fixedAssets=initialCapex,workingCapital=initialWorkingCapital;
 const years=[{revenue:100,cashOperatingCosts:70,workingCapitalChange:5},{revenue:100,cashOperatingCosts:70,workingCapitalChange:5},{revenue:100,cashOperatingCosts:70,workingCapitalChange:0}].map((input,i)=>{
  // Keep capital in this project at 100: capex + working-capital growth = depreciation.
  const depreciation=10,capex=depreciation-input.workingCapitalChange,ebit=input.revenue-input.cashOperatingCosts-depreciation,nopat=ebit*(1-m.tax),netInvestment=capex-depreciation+input.workingCapitalChange,fcff=nopat+depreciation-capex-input.workingCapitalChange;
  const principalRepaid=debt,debtIssued=debt,netBorrowing=0,retainedEquity=0,openingEquity=initialEquity,closingDebt=debt,closingEquity=initialEquity;
  const interest=debt*m.debtRate/100,taxShield=interest*m.tax,netDebtCost=interest-taxShield,cashToEquity=fcff-netDebtCost,equityHurdle=openingEquity*m.equityRate/100,cashAboveHurdle=cashToEquity-equityHurdle;
  // Surplus leaves this project's capital base and funds a separate project.
  const reinvestedEquity=Math.max(0,cashAboveHurdle),newProjectInvestment=reinvestedEquity/m.equityWeight,newProjectDebt=newProjectInvestment*m.debtWeight,newProjectRequiredReturn=m.wacc,newProjectAnnualHurdle=newProjectInvestment*newProjectRequiredReturn/100;
  fixedAssets+=capex-depreciation;workingCapital+=input.workingCapitalChange;
  return{year:i+1,...input,ebit,depreciation,capex,nopat,netInvestment,fcff,interest,taxShield,netDebtCost,cashToEquity,openingEquity,equityHurdle,cashAboveHurdle,debt,netBorrowing,retainedEquity,principalRepaid,debtIssued,closingDebt,closingEquity,closingFixedAssets:fixedAssets,closingWorkingCapital:workingCapital,reinvestedEquity,newProjectInvestment,newProjectDebt,newProjectRequiredReturn,newProjectAnnualHurdle};
 });
 return{initialInvestment,initialCapex,initialWorkingCapital,debt,initialEquity,tax:m.tax,debtRate:m.debtRate,equityRate:m.equityRate,debtWeight:m.debtWeight,equityWeight:m.equityWeight,wacc:m.wacc,years};
}

function companyProjectValuation(m=companyValueViewModel(),selected=companySelectedYear()){
 const t=companyCapitalTimeline(m,selected),r=m.wacc/100,life=5;
 const originalCash=Array(life).fill(t.plan.years[0].fcff);
 const projects=t.projects.map((p,index)=>{
  const entryYear=index===0?0:index,age=Math.max(0,t.year-entryYear),remaining=Math.max(0,life-age),capital=remaining>0?p.amount:0;
  const annualCash=index===0?originalCash:Array(life).fill(p.amount*r);
  const cashFlows=annualCash.slice(age).map((operatingCash,i)=>({inYears:i+1,calendarYear:t.year+i+1,operatingCash,capitalRecovery:i===remaining-1?p.amount:0}));
  const rawValue=cashFlows.reduce((sum,c)=>sum+(c.operatingCash+c.capitalRecovery)/(1+r)**c.inYears,0),rawNPV=rawValue-capital,npv=Math.abs(rawNPV)<1e-9?0:rawNPV,value=npv===0?capital:rawValue;
  return{...p,index:index+1,entryYear,age,remaining,capital,cashFlows,value,npv,debt:capital*m.debtWeight,equityInvested:capital*m.equityWeight};
 });
 const capital=projects.reduce((sum,p)=>sum+p.capital,0),value=projects.reduce((sum,p)=>sum+p.value,0),npv=projects.reduce((sum,p)=>sum+p.npv,0),debt=projects.reduce((sum,p)=>sum+p.debt,0),equityInvested=projects.reduce((sum,p)=>sum+p.equityInvested,0);
 return{year:t.year,life,wacc:m.wacc,projects,capital,value,npv,debt,equityInvested,equityValue:value-debt};
}

function companyInitialCapitalGraphic(m){const a=companyAnnualCashModel(m);return `<div class="po-start-funding"><header>START OF YEAR 1</header><div class="po-start-path"><div><span>Debt</span><strong>${sysN(a.debt)}</strong></div><b>+</b><div><span>Equity</span><strong>${sysN(a.initialEquity)}</strong></div><b>→</b><div class="po-start-project"><span>Project 1 · initial investment</span><strong>${sysN(a.initialInvestment)}</strong><small>${sysN(a.initialCapex)} fixed assets + ${sysN(a.initialWorkingCapital)} working capital</small></div></div></div>${companyTimeNavigation(0)}`}

function companyProjectValuationDetails(v){return `<details class="po-valuation-detail"><summary>Where do the NPV numbers come from?</summary><p>Operating cash is after operating tax, before financing. Project 1: 15 each year for 5 years, plus 100 capital recovered at the end of Year 5. Each new project: annual cash of ${sysN(v.wacc)}% of its investment for 5 years, matching WACC. Its NPV is zero. Capital is recovered with the final cash flow.</p><div class="po-npv-rule">Remaining NPV = PV of remaining operating cash + PV of capital recovery − capital still invested</div><div class="po-pv-projects">${v.projects.map(p=>`<article><header>Project ${p.index} · ${p.remaining} years left</header><div class="po-future-cash">${p.cashFlows.map(c=>`<span><small>End Y${c.calendarYear}</small><b>${sysN(c.operatingCash)}${c.capitalRecovery?' + '+sysN(c.capitalRecovery):''}</b>${c.capitalRecovery?'<em>capital recovery</em>':''}</span>`).join('')}</div><p>PV at ${sysN(v.wacc)}%: <b>${sysN(p.value)}</b> − invested capital ${sysN(p.capital)} = <strong>${sysSigned(p.npv)}</strong></p></article>`).join('')}</div><p>Snapshots are after that year’s cash flows and reinvestment. Only funded projects are valued; future growth opportunities are excluded. The formula and investor view below explain Project 1 at its initial investment date. New-project cash flows enter the balance valuation separately; their distributions are not reinvested in this illustration. A lower remaining NPV can reflect profits already paid out; these are no longer future cash flows. Debt is valued at par. WACC is held constant as an assumed project discount rate, using a 40/60 funding mix. Those are financing proportions for invested capital, not post-NPV market-value weights. NPV increases equity value; debt is not rebalanced when value is created.</p></details>`}

function companyScaledBalance(m,v){
 const snapshots=Array.from({length:4},(_,year)=>companyProjectValuation(m,year)),maximum=Math.max(...snapshots.map(s=>s.value)),ratio=v.value/maximum;
 const projectName=p=>'Project '+p.index;
 return `<div class="pg-stage" style="--pg-size:${ratio}" data-scale-max="${maximum}" data-total-value="${v.value}" aria-label="${companyTimeLabel(v.year)}: firm value ${sysN(v.value)}, equity value ${sysN(v.equityValue)}, debt ${sysN(v.debt)}. Both sides use the same proportional scale."><div class="pg-column"><header class="pg-header pg-firm-heading"><span>FIRM VALUE</span><strong>${sysN(v.value)}</strong></header><div class="pg-stack pg-assets" data-value="${v.value}"><div class="pg-premiums" style="flex:${v.npv}" data-value="${v.npv}">${v.projects.filter(p=>p.npv>0).slice().reverse().map(p=>`<div class="pg-premium-band" style="flex:${p.npv};--pg-tint:${.04*p.index}" data-value="${p.npv}" title="${projectName(p)} · remaining NPV ${sysSigned(p.npv)}" aria-label="${projectName(p)}: remaining NPV ${sysSigned(p.npv)}">${p.npv/maximum*300>=23?`<span>NPV<sub>${p.index}</sub> <b>${sysSigned(p.npv)}</b></span>`:''}</div>`).join('')}</div><div class="pg-capital" style="flex:${v.capital}" data-value="${v.capital}">${v.projects.slice().reverse().map(p=>`<div class="pg-capital-band ${p.index>1?'pg-capital-added':''} ${v.year>0&&p.index===v.year+1?'pg-latest':''}" style="flex:${p.capital};--pg-tint:${.03*p.index}" data-value="${p.capital}" title="${projectName(p)} · capital ${sysN(p.capital)}"><span>${projectName(p)}${v.year>0&&p.index===v.year+1?'<small class="rt-new-badge">NEW</small>':''}</span><strong>${sysN(p.capital)}</strong></div>`).join('')}</div></div></div><b class="pg-equal" aria-hidden="true">=</b><div class="pg-column"><header class="pg-header pg-equity-heading"><span>DEBT + EQUITY</span><strong>${sysN(v.value)}</strong></header><div class="pg-stack pg-financing" data-value="${v.value}"><div class="pg-equity-group" style="flex:${v.equityValue}" data-value="${v.equityValue}" aria-label="Total equity value ${sysN(v.equityValue)}"><div class="pg-value-created ${v.npv/maximum<.16?'pg-npv-compact':''}" style="flex:${v.npv}" data-value="${v.npv}"><span>Remaining NPV</span><strong>${sysSigned(v.npv)}</strong></div><div class="pg-equity-invested" style="flex:${v.equityInvested}" data-value="${v.equityInvested}"><span>Equity invested</span><strong>${sysN(v.equityInvested)}</strong></div></div><div class="pg-debt" style="flex:${v.debt}" data-value="${v.debt}"><span>Debt</span><strong>${sysN(v.debt)}</strong></div></div></div></div>`;
}

function companySurplusTransfer(m,year){
 if(year===0)return '';
 const y=companyAnnualCashModel(m).years[year-1];if(y.reinvestedEquity<=0)return '';
 return `<div class="rt-transfer" aria-label="Year ${year} realised surplus becomes equity in project ${year+1}, with new debt funding the remaining investment"><div class="rt-source"><span>Year ${year} · realised surplus</span><strong>${sysN(y.reinvestedEquity)}</strong></div><b aria-hidden="true">→</b><div class="rt-destination"><header>Project ${year+1} <small class="rt-new-badge">NEW</small></header><div><span>${sysN(y.reinvestedEquity)} equity</span><i>+</i><span>${sysN(y.newProjectDebt)} debt</span><i>=</i><strong>${sysN(y.newProjectInvestment)}</strong></div><small>↑ Capital block in the balance above</small></div></div>`;
}
function companyEndValueModel(m=companyValueViewModel()){
 const project=companyProjectValuation(m,0).projects[0],investment=project.capital,years=project.cashFlows.length,r=m.wacc/100,factor=1+r,charge=investment*r;
 const rows=project.cashFlows.map((flow,i)=>{const year=i+1,cash=flow.operatingCash,surplus=cash-charge,reinvestYears=years-year,multiplier=factor**reinvestYears,requiredEnd=charge*multiplier,cashEnd=cash*multiplier;return{year,reinvestYears,multiplier,required:charge,cash,surplus,requiredEnd,cashEnd,surplusEnd:surplus*multiplier,requiredGrowth:requiredEnd-charge,cashGrowth:cashEnd-cash,capitalRecovery:flow.capitalRecovery}});
 const sum=key=>rows.reduce((total,y)=>total+y[key],0),requiredNominal=sum('required'),cashNominal=sum('cash'),requiredReturnEnd=sum('requiredEnd'),cashReturnEnd=sum('cashEnd'),requiredTotal=investment+requiredReturnEnd,actualTotal=investment+cashReturnEnd,excess=actualTotal-requiredTotal,compoundFactor=factor**years,classicNPV=project.npv;
 return{investment,years,wacc:m.wacc,r,factor,cash:rows[0].cash,charge,rows,requiredNominal,cashNominal,requiredReturnEnd,cashReturnEnd,requiredReinvestGain:requiredReturnEnd-requiredNominal,actualReinvestGain:cashReturnEnd-cashNominal,requiredTotal,actualTotal,excess,compoundFactor,classicNPV,carriedNPV:classicNPV*compoundFactor,totalSurplusReinvestGain:excess-sum('surplus')};
}

function companyCashProductionBuild(q){
 return `<div class="cl-production-build"><header>Project cash accumulated to end Y5</header><div class="cl-production-terms">${q.rows.map(y=>`<span data-year="${y.year}" data-end-cash="${y.cashEnd}"><small>Year ${y.year} cash</small><b>${sysN(y.cash)}${y.reinvestYears?' × '+sysN(q.factor,4)+'<sup>'+y.reinvestYears+'</sup>':''}</b><strong>${sysN(y.cashEnd)}</strong></span>`).join('<i>+</i>')}<i>+</i><span class="cl-production-capital"><small>Capital recovered</small><b>At end Y5</b><strong>${sysN(q.investment)}</strong></span></div><footer>${sysN(q.cashReturnEnd)} accumulated cash + ${sysN(q.investment)} capital = <b>${sysN(q.actualTotal)}</b></footer></div>`;
}

function companyWACCTaxBridge(m){const capital=100,gross=capital*(m.debtWeight*m.debtRate+m.equityWeight*m.equityRate)/100,shield=capital*m.debtWeight*m.debtRate/100*m.tax;return '<details class="cf-tax-bridge"><summary>Why WACC is not a cash payment</summary><div class="cf-finance-path"><span>Weighted pre-tax hurdle<b>'+sysN(gross)+'</b></span><i>−</i><span>Interest tax benefit<b>'+sysN(shield)+'</b></span><i>=</i><span>After-tax hurdle<b>'+sysN(capital*m.wacc/100)+'</b></span></div><p>Per 100 invested using the assumed 40/60 funding mix. Debt interest is contractual; equity return can be cash plus value growth. This terminal comparison uses an opportunity-cost benchmark, not a schedule of payouts.</p></details>'}
function companyEndValueGraphic(m){
 const q=companyEndValueModel(m);
 return `<div class="nm-required-path"><div><span>Initial investment</span><strong>${sysN(q.investment)}</strong></div><i>→</i><div><span>The project must cover</span><strong>${sysN(q.wacc)}%</strong><small>WACC · after tax</small></div><i>→</i><div class="nm-required-total"><span>Alternative investment · end Y5</span><strong>${sysN(q.requiredTotal)}</strong><small>${sysN(q.investment)} × ${sysN(q.factor,4)}<sup>5</sup></small></div></div><div class="npv-common-date">Compare both investments at end Y5 · reinvest earlier cash at WACC.</div>${companyCashProductionBuild(q)}<div class="cl-terminal"><div><span>Project total</span><strong>${sysN(q.actualTotal)}</strong></div><i>−</i><div><span>Required total</span><strong>${sysN(q.requiredTotal)}</strong></div><i>→</i><div class="cl-terminal-surplus"><span>Surplus</span><strong>${sysN(q.excess)}</strong></div></div><div class="cl-value-bridge npv-shared-value"><header>The same surplus · two dates</header><div><span>NPV today<strong>${sysN(q.classicNPV)}</strong></span><b>× ${sysN(q.factor,4)}<sup>5</sup></b><i>→</i><span>Surplus · end Y5<strong>${sysN(q.excess)}</strong></span></div></div>${companyWACCTaxBridge(m)}<details class="cl-cash-details nm-cash-details"><summary>Follow the cash · required return and surplus</summary>${companyYearOneWalkthrough(q)}${companySplitCashProduction(q)}</details><details class="cl-required-details"><summary>See the annual hurdle and its growth</summary><div class="ev-year-cards">${q.rows.map(y=>`<article><header>Year ${y.year}</header><strong>${sysN(y.required)}</strong><small>${sysN(q.investment)} × ${sysN(q.wacc)}%</small><span>× ${sysN(q.factor,4)}<sup>${y.reinvestYears}</sup></span><b>${sysN(y.requiredEnd)}</b><em>at end Y5</em></article>`).join('')}</div><div class="cl-required-sum">${sysN(q.investment)} capital + ${sysN(q.requiredReturnEnd)} accumulated hurdle returns = <b>${sysN(q.requiredTotal)}</b></div></details>`;
}

function companySplitCashProduction(q){
 const branch=(label,start,end,y,kind)=>`<div class="sp-branch sp-${kind}"><span>${label}</span><strong>${sysN(start)}</strong><small>× ${sysN(q.factor,4)}<sup>${y.reinvestYears}</sup></small><b>${sysN(end)}</b><em>at end Y5</em></div>`;
 return `<section class="ev-rail ev-actual ev-split-production cl-cash-split"><header><div><h5>Split each year’s cash</h5><span>Split cash against the initial-investment hurdle; the excess is economic surplus.</span></div></header><div class="ev-year-cards">${q.rows.map(y=>`<article><header>Year ${y.year} · cash</header><strong>${sysN(y.cash)}</strong><div class="sp-branches">${branch('Hurdle return',y.required,y.requiredEnd,y,'capital-return')}${branch('Surplus',y.surplus,y.surplusEnd,y,'surplus')}</div></article>`).join('')}</div></section>`;
}

function companyClassicNPVGraphic(m){
 const q=companyEndValueModel(m),pvCash=q.classicNPV+q.investment;
 const frac=(top,bottom)=>`<span class="dcf-fraction"><span>${top}</span><span>${bottom}</span></span>`;
 const terms=q.rows.map(y=>{const cash=y.cash+y.capitalRecovery;return `<span class="dcf-numeric-term" data-year="${y.year}" data-cash="${cash}" data-pv="${cash/q.factor**y.year}"><small>Year ${y.year}</small>${frac(sysN(cash),sysN(q.factor,4)+(y.year===1?'':'<sup>'+y.year+'</sup>'))}</span>`}).join('<i>+</i>');
 return `<div class="npv-lean-formula"><div class="npv-input-strip">Project 1 · ${sysN(q.investment)} invested · ${sysN(q.cash)} cash each year · ${sysN(q.investment)} recovered in Year 5</div><div class="dcf-equation dcf-numeric-equation"><strong>NPV</strong><i>=</i>${terms}<i>−</i><span>${sysN(q.investment)}</span></div><div class="npv-hurdle"><b>WACC</b></div><div class="npv-wacc-calculation"><span class="npv-wacc-debt"><small>Debt · after tax</small><b>${sysN(m.debtWeight*100)}% × ${sysN(m.debtRate)}% × (1 − ${sysN(m.tax*100)}%)</b></span><i>+</i><span class="npv-wacc-equity"><small>Equity</small><b>${sysN(m.equityWeight*100)}% × ${sysN(m.equityRate)}%</b></span><i>=</i><strong>${sysN(q.wacc)}%</strong></div><p class="npv-wacc-assumption">Teaching assumption: hold WACC constant using a 40/60 funding mix. NPV adds to equity value; debt is not rebalanced.</p><div class="dcf-result"><span>PV of cash flows <b>${sysN(pvCash)}</b></span><i>−</i><span>Initial investment <b>${sysN(q.investment)}</b></span><i>=</i><span class="dcf-npv npv-shared-value"><small>Surplus value today · NPV</small><strong>${sysN(q.classicNPV)}</strong></span></div></div>`;
}

function companyYearOneWalkthrough(q){const y=q.rows[0];return `<div class="cl-first-year"><header>Start with Year 1</header><div class="cl-one-split"><span>Cash received<strong>${sysN(y.cash)}</strong></span><i>−</i><span>WACC hurdle<strong>${sysN(y.required)}</strong></span><i>=</i><span class="cl-one-surplus">Surplus<strong>${sysN(y.surplus)}</strong></span></div><div class="cl-one-growth"><span>Keep the surplus invested for ${y.reinvestYears} more years</span><strong>${sysN(y.surplus)} × ${sysN(q.factor,4)}<sup>${y.reinvestYears}</sup> → ${sysN(y.surplusEnd)} at end Y5</strong></div></div>`}

function companyNPVLinkedStep(n,title,body){return sysStep(n,title,body).replace('class="bes-block sys-block"','class="bes-block sys-block npv-linked-step"')}

function companyProjectValuationDetailsOpen(v){return companyProjectValuationDetails(v).replace('<details class="po-valuation-detail">','<section class="npv-inline-project-details">').replace('<summary>Where do the NPV numbers come from?</summary>','<h5>Project cash flows and NPV</h5>').replace('</details>','</section>')}

function essentialFirms(){return sysPage('Capital has a cost.<br><em>The surplus creates value.</em>','',systemCompanyBody())}
function companyValueTerm(value,label,kind=''){return `<div class="cv-term ${kind}"><strong>${value}</strong><span>${label}</span></div>`}
function companySurplusValueModel(m=companyValueViewModel()){const q=companyEndValueModel(m),rows=q.rows.map(y=>({year:y.year,cash:y.cash,required:q.charge,surplus:y.cash-q.charge,factor:1/q.factor**y.year,pv:(y.cash-q.charge)/q.factor**y.year})),npv=rows.reduce((sum,y)=>sum+y.pv,0);return{investment:q.investment,years:q.years,wacc:q.wacc,charge:q.charge,cash:q.cash,surplus:rows[0].surplus,rows,npv,value:q.investment+npv,classicNPV:q.classicNPV}}
function companyCostBuildUpModel(m=companyValueViewModel()){
 const bank=bankDualPricingModel(),contract=bankContractPricing(bank),equity=systemEquityModel(),curve=marketRateCurve(),bond=m.debtSource==='bond',spread=Number(systemLesson.bondCorporateSpread);
 const debtCharges=bond?[{key:'credit',label:'Credit risk',value:spread*2/3},{key:'liquidity',label:'Liquidity risk',value:spread/3}]:bank.common.map(item=>({...item,label:({credit:'Credit risk',liquidity:'Extra liquidity buffer',operating:'Operating costs',capital:'Capital & profit'})[item.key]||item.name}));
 const debtMarket=bond||contract.type==='fixed'?curve.marketBase:curve.overnight,debtFundingAdjustment=bond?0:contract.fundingBase-debtMarket,debtFixing=contract.adjustment,debtChargesTotal=debtCharges.reduce((s,item)=>s+item.value,0),debtBuilt=debtMarket+debtFundingAdjustment+debtChargesTotal;
 const equityBase=equity.riskFree,equityRisk=equity.totalRiskCharge,equityBuilt=equityBase+equityRisk;
 return{debtSource:m.debtSource,debtMarket,debtFundingAdjustment,debtFixing,debtCharges,debtChargesTotal,debtBuilt,equityBase,equityBeta:equity.beta,equityMarketPremium:equity.premium,equityRisk,equityFactors:equity.factors,equityBuilt,debtAfterTax:m.debtRate*(1-m.tax),debtContribution:m.debtContribution,equityContribution:m.equityContribution,wacc:m.wacc,contract:bond?'fixed':contract.type};
}

 const fixing=false?'<div class="ccbu-fixing"><span>5-year fixed-rate lock</span><strong>'+pp(r.debtFixing)+'</strong></div>':'';
 return '<div class="ccbu-story '+(r.debtSource==='bank'?'ccbu-source-bank':'ccbu-source-bond')+'"><div class="ccbu-caption">One shared rate curve · illustrative nominal rates</div>'+companySharedRateBridge()+'<div class="ccbu-branches">'
 +'<section class="ccbu-branch ccbu-debt" aria-label="Build the cost of debt"><header><h5>Debt</h5><button data-sys-node="'+(r.debtSource==='bank'?'banks':'bonds')+'">'+(r.debtSource==='bank'?'Bank pricing':'Bond pricing')+' ↗</button></header>'+sysChoices('companyDebtSource',[['bond','5-year bond'],['bank','Bank loan']])+(r.debtSource==='bank'?'<div class="ccbu-contract" role="group" aria-label="Company loan contract"><button data-bank-contract="variable" aria-pressed="'+(r.contract==='variable')+'">Variable</button><button data-bank-contract="fixed" aria-pressed="'+(r.contract==='fixed')+'">Fixed · 5 years</button></div>':'')+'<div class="ccbu-market"><span>'+(r.contract==='fixed'?'Shared 5-year base':'Overnight market base')+'</span><strong>'+n(r.debtMarket)+'%</strong></div>'+(r.debtSource==='bank'?'<div class="ccbu-funding"><span>Matched funding basis</span><strong>'+pp(r.debtFundingAdjustment)+'</strong></div>':'')+''+fixing+'<div class="ccbu-add" aria-hidden="true">+</div><div class="ccbu-charge-grid">'+r.debtCharges.map(item=>'<div data-company-charge="'+item.key+'"><span>'+item.label+'</span><strong>'+pp(item.value)+'</strong></div>').join('')+'</div><div class="ccbu-down" aria-hidden="true">↓</div><button class="ccbu-result" data-rates-open="pricing" data-rates-anchor=".rrline-market" data-rates-highlight="debt" data-rates-source="company-debt"><span>Cost of debt ↗</span><strong>'+n(m.debtRate)+'%</strong></button><div class="ccbu-weight"><b>'+n(m.debtWeight*100)+'% × '+n(m.debtRate)+'% × (1 − '+n(m.tax*100)+'%)</b><strong>'+n(r.debtContribution)+' pp</strong></div></section>'
 +'<section class="ccbu-branch ccbu-equity" aria-label="Build the cost of equity"><header><h5>Equity</h5><span>3-factor example</span></header><div class="ccbu-market"><span>Shared 5-year base</span><strong>'+n(r.equityBase)+'%</strong></div><div class="ccbu-add" aria-hidden="true">+</div><div class="ccbu-equity-risk"><span>Compensation for systematic risks</span><div class="ccbu-beta"><div><small>Equity beta</small><strong>'+n(r.equityBeta)+'</strong></div><b aria-hidden="true">×</b><div><small>Market risk premium</small><strong>'+n(r.equityMarketPremium)+'%</strong></div></div><div class="ccbu-factor-extras"><span>Value <b>'+pp(r.equityFactors.value)+'</b></span><span>Size <b>'+pp(r.equityFactors.size)+'</b></span></div><strong class="ccbu-risk-total">'+pp(r.equityRisk)+'</strong></div><div class="ccbu-down" aria-hidden="true">↓</div><button class="ccbu-result" data-rates-open="pricing" data-rates-anchor=".rrline-market" data-rates-highlight="equity" data-rates-source="company-equity"><span>Cost of equity ↗</span><strong>'+n(m.equityRate)+'%</strong></button><div class="ccbu-weight"><b>'+n(m.equityWeight*100)+'% × '+n(m.equityRate)+'%</b><strong>'+n(r.equityContribution)+' pp</strong></div></section></div>'
 +'<svg class="ccbu-merge" viewBox="0 0 800 38" preserveAspectRatio="none" aria-hidden="true"><path d="M200 0V14H400V34M600 0V14H400M394 28l6 6 6-6"/></svg><div class="ccbu-wacc"><span>WACC</span><strong>'+n(r.wacc)+'%</strong><small>'+n(r.debtContribution)+' pp + '+n(r.equityContribution)+' pp</small></div></div>';
}
function systemCompanyBody(){const m=companyValueViewModel(),q=companySurplusValueModel(m),n=v=>sysN(v,2);const required=companyCostBuildUpGraphic(m)+'<p class="npve-assumption">Assume constant target D/E (market values) and business risk.</p>';const surplus='<div class="npve-equation"><div><span>'+ratesInlineLink('Invested capital ↗','demand','.rh-single-plot','','company-investment')+'</span><strong>'+n(q.investment)+'</strong></div><b aria-hidden="true">×</b><div><span>WACC</span><strong>'+n(q.wacc)+'%</strong></div><b aria-hidden="true">=</b><div class="npve-required"><span>Annual capital charge</span><strong>'+n(q.charge)+'</strong></div></div><div class="npve-recovery"><span>Capital invested for '+q.years+' years</span><b aria-hidden="true">→</b><strong>'+n(q.investment)+' recovered at end Y'+q.years+'</strong></div><div class="npve-down" aria-hidden="true">↓</div><div class="npve-cash"><span>After-tax free cash flow · each year</span><strong>'+n(q.cash)+'</strong></div><div class="npve-down" aria-hidden="true">↓</div><div class="npve-split" role="img" aria-label="Annual cash '+n(q.cash)+' covers an economic capital charge '+n(q.charge)+' and leaves surplus '+n(q.surplus)+'"><div class="npve-required" style="flex:'+q.charge+'"><span>Capital charge</span><strong>'+n(q.charge)+'</strong></div><div class="npve-surplus" style="flex:'+q.surplus+'"><span>Annual surplus</span><strong>'+n(q.surplus)+'</strong></div></div>';const value='<div class="npve-pv-heading"><span>'+n(q.surplus)+' surplus each year × '+q.years+' years</span><b aria-hidden="true">↓</b><span>Value today at '+n(q.wacc)+'%</span></div><div class="npve-pv-grid">'+q.rows.map(y=>'<div class="npve-pv-year" data-surplus-year="'+y.year+'" data-surplus="'+y.surplus+'" data-pv="'+y.pv+'"><small>Year '+y.year+'</small><span>'+n(y.surplus)+' × '+sysN(y.factor,4)+'</span><strong>'+n(y.pv)+'</strong></div>').join('')+'<div class="npve-pv-total"><small>NPV · today</small><span>Σ present values</span><strong>'+n(  +'<article class="rrb-box rrb-base rrline-market"><h5>5-year base</h5><strong class="rrb-number" data-rate-block="base">'+p(m.marketBase)+'</strong><small>'+sysN(m.realBase)+' + '+sysN(m.expectedInflation)+' + '+sysN(m.termPremium)+'</small><span class="rrb-base-label">Same base for both paths</span></article>'+op('→')
 +'<div class="rrb-branches rrline-premia rrline-returns" role="group" aria-label="Two separate paths from the same market base"><article class="rrb-box rrb-bond rrline-risk-group"><h5>Bonds</h5><span class="rrb-branch-base">'+p(m.marketBase)+' base</span>'+row('Credit',m.bondCredit)+row('Liquidity',m.bondLiquidity)+'<button class="rrb-output rrline-output" data-sys-node="bonds"><span>Required yield ↗</span><strong data-rate-block="bonds">'+p(m.bondYield)+'</strong></button></article>'

function systemFundDetailedBody(){

mpliance with every mandate constraint. Unintended exposure does not prove pure luck. These are fixed-loadings teaching examples, not fitted regressions: adding factors need not reduce an estimated alpha. Model choice, changing exposures, costs and statistical uncertainty still matter.</p><p>Synthetic one-period equity-sleeve illustration, not an estimated regression. Portfolio market beta 1; value loading ${sysN(m.valueBeta)}; size loading ${sysN(m.sizeBeta)}. Other selected exposures, including profitability and investment in FF5, are zero. The broad-market benchmark has market beta 1 and value and size loadings zero. The pre-agreed value benchmark has value loading 0.75 and size loading zero. The hypothetical value-only portfolio has value loading 0.75; the mixed portfolio has value and size loadings 0.5 each. Default factor returns are 4% for value and 2% for size, producing 3 pp from value alone or 2 pp value + 1 pp size. These are teaching assumptions, not observed market estimates. Factor contributions are in percentage points and fees are deducted once within each separate view. When passive equity is selected, the fund exactly tracks its agreed index before fees; no selection residual is added. Bond implementation choices are conceptual; no bond returns are assumed.</p><p>Active attribution compares portfolio and benchmark exposures. CAPM includes market exposure only. The intermediate market + value model still omits size. Omitted factor returns remain in the relevant residual, including the benchmark’s residual where appropriate. With the selected Fama–French factors, the style benchmark’s return is explained by its exposures. A model residual is not proof of skill; model alpha requires multi-period estimation and uncertainty checks. Timing, omitted exposures and luck also matter.</p><p>The selected goal sets a hypothetical ${sysN(fundsPolicyExample().equityWeight*100)}/${sysN(fundsPolicyExample().bondWeight*100)} policy mix; these weights are teaching assumptions, not an optimised recommendation. Regional weights and realised regional returns are not supplied, so allocation, regional, bond and FX effects are shown as attribution layers rather than computed. The numerical factor example covers only the equity sleeve. Its portfolio active-return contribution equals its ${sysN(fundsPolicyExample().equityWeight*100)}% policy weight × its active return, with no tactical allocation deviation in this comparison. The other sleeve’s contribution is not calculated. Benchmark choices represent alternative pre-agreed mandates, not an instruction to change the benchmark after observing the result.</p></details>`;
}
function fundsLeanSigned(value){return Math.abs(value)<1e-9?'0':sysSigned(value)}
function fundsModelStages(m=systemFundModel()){const a=fundsBenchmarkAttribution(m),gross=m.gross-m.benchmark,clean=x=>Math.abs(x)<1e-10?0:x;return[{key:'capm',label:'CAPM',detail:'Market',parts:[['market',a.marketActive],['residual',clean(gross-a.marketActive)]]},{key:'marketValue',label:'+ Value',detail:'Market + value',parts:[['market',a.marketActive],['value',a.valueActive],['residual',clean(gross-a.marketActive-a.valueActive)]]},{key:'ff3',label:'+ Size',detail:'Market + value + size',parts:[['market',a.marketActive],['value',a.valueActive],['size',a.sizeActive],['residual',clean(gross-a.marketActive-a.valueActive-a.sizeActive)]]}].map(r=>({...r,residual:r.parts.find(x=>x[0]==='residual')[1]}))}
function fundsFactorLadder(m){const rows=fundsModelStages(m),negative=Math.max(0,...rows.map(r=>r.parts.reduce((n,[k,v])=>n+Math.max(0,-v),0))),positive=Math.max(0,...rows.map(r=>r.parts.reduce((n,[k,v])=>n+Math.max(0,v),0))),range=negative+positive||1,zero=100*negative/range,selected=m.includeSize?'ff3':m.includeValue?'marketValue':'capm',names={market:'Market',value:'Value',size:'Size',residual:'Unexplained'},gross=m.gross-m.benchmark;
 return `<div class="fund-factor-ladder" data-fund-ladder-gross="${gross}">${fundsEquityIsPassive()?'<div class="fund-factor-example-label">Index exposures match the benchmark.</div>':''+sysChoices('fundFactorMix',[['value','Value only'],['valueSize','Value + size']]).replace('aria-label="Choose a scenario"','aria-label="Hypothetical factor-exposure example"')}<div class="fund-factor-ladder-head"><span>Model</span><span>Same gross gap: <b>${fundsLeanSigned(gross)} pp</b></span><span>Unexplained</span></div><div class="fund-factor-model-rows" role="group" aria-label="Select a factor model">${rows.map(r=>{let right=zero,left=zero;const segments=r.parts.filter(([k,v])=>Math.abs(v)>1e-10).map(([kind,v])=>{const width=100*Math.abs(v)/range,x=v>0?right:left-width;if(v>0)right+=width;else left-=width;return `<span class="fund-ladder-segment fund-ladder-${kind}" style="left:${Math.max(0,Math.min(100,x))}%;width:${Math.min(100,width)}%" title="${names[kind]}: ${fundsLeanSigned(v)} pp">${width>=20?' <b>'+sysN(v)+'</b>':''}</span>`}).join('');return `<button class="fund-factor-model-row" data-sys-key="fundModel" data-sys-choice="${r.key}" data-fund-ladder-model="${r.key}" data-fund-ladder-residual="${r.residual}" aria-pressed="${selected===r.key}"><span class="fund-ladder-model-label">${r.label}</span><span class="fund-factor-track" role="img" aria-label="${r.detail}: ${r.parts.map(([k,v])=>names[k]+' '+sysN(v)+' pp').join(', ')}">${segments||'<span class="fund-ladder-empty">0 pp</span>'}<i class="fund-ladder-zero" style="left:${zero}%"></i></span><span class="fund-ladder-leftover ${Math.abs(r.residual)<1e-9?'fund-ladder-zero-residual':''}">${fundsLeanSigned(r.residual)}<small> pp</small></span></button>`}).join('')}</div><div class="fund-factor-ladder-legend"><span class="fund-legend-value" title="HML: high minus low book-to-market">Value</span><span class="fund-legend-size" title="SMB: small minus big companies">Size · small firms</span><span class="fund-legend-residual">Unexplained</span></div><small>Hypothetical returns · before fees.</small></div>`}
function fundsCompactEvaluation(m){
 const a=fundsBenchmarkAttribution(m),p=fundsPolicyExample(),style=systemLesson.fundBenchmark==='style',model=fundsModelLabel(),passive=fundsEquityIsPassive(),mixed=m.sizeBeta!==0;
 const terms=[...(Math.abs(a.marketActive)>1e-9?[['Market exposure',a.marketActive,'market']]:[]),...(a.includeValue?[['Value',a.valueActive,'value']]:[]),...(a.includeSize&&(mixed||Math.abs(a.sizeActive)>1e-9)?[['Size',a.sizeActive,'size']]:[]),['Unexplained gap',a.residualActive,'residual'],...(Math.abs(m.fee)>1e-9?[['Fee',-m.fee,'fee']]:[])];

 const how=`<details class="fund-gap-how"><summary>Factor assumptions and calculations</summary><p>Value (HML): high versus low book-to-market. Size (SMB): small versus big companies. These are hypothetical factor returns, not observed estimates.</p><div class="fund-gap-loading">Value: (${sysN(m.valueBeta)} − ${sysN(a.benchmarkValueBeta)}) × ${sysN(m.valueFactorReturn)}% = <b>${fundsLeanSigned(a.valueActive)} pp</b><br>Size: (${sysN(m.sizeBeta)} − ${sysN(a.benchmarkSizeBeta)}) × ${sysN(m.sizeFactorReturn)}% = <b>${fundsLeanSigned(a.sizeActive)} pp</b></div><p>Value-only loadings: 0.75 value / 0 size. Mixed portfolio: 0.5 value / 0.5 size. At the default 4% value and 2% size returns, both examples earn 3 pp above the broad market before fees. Each model explains the same observed return; it does not change it. Additional FF5 loadings are zero here.</p>${sysChoices('fundModel',[['capm','CAPM'],['marketValue','Market + value'],['ff3','Fama–French 3'],['ff5','Fama–French 5']])}</details>`;
 const body=`<div class="fund-return-scope fund-linked-scope"><span data-fund-evaluation-weight="${p.equityWeight}"><b>Equity sleeve</b></span><i aria-hidden="true">→</i><span>${style?'Value-style':'Broad-market'} benchmark</span></div><div class="fund-return-route fund-gap-story"><article class="fund-return-compare"><header><b>A</b><strong>${passive?'Did we track the index?':'Did we beat the benchmark?'}</strong></header><div class="fund-return-equation"><span>Fund · ${m.fee===0?'zero fees':'after fees'}<strong>${sysN(m.net)}%</strong></span><i>−</i><span>Benchmark<strong>${sysN(m.benchmark)}%</strong></span><i>=</i><span class="fund-return-gap ${m.active<0?'fund-return-loss':''}">Difference<strong data-fund-summary-active="${m.active}">${fundsLeanSigned(m.active)} pp</strong></span></div><small>pp = percentage points</small></article><article class="fund-return-explain"><header><b>B</b><strong>What explains this gap?</strong></header>${fundsFactorLadder(m)}<div class="fund-ladder-selected-equation" aria-label="Selected model contributions, after fees">${breakdown}<i aria-hidden="true">=</i><strong data-fund-gap-total="${m.active}">${fundsLeanSigned(m.active)} pp</strong></div><small>Selected: ${model}</small>${how}</article><article class="fund-return-check fund-mandate-compact"><header><b>C</b><strong>Was it planned?</strong></header>${passive?'<div class="fund-mandate-tracking"><span>Chosen index</span><i aria-hidden="true">→</i><strong>Matching exposures</strong></div><small>Tracking before fees is assumed.</small>':`<div class="fund-mandate-scope">Factor-explained return</div><div class="fund-mandate-outcomes"><div class="fund-mandate-planned"><span>Planned ${mixed?'value + size':'value'}</span><i aria-hidden="true">→</i><strong>Source matches plan</strong></div><div class="fund-mandate-unplanned"><span>Exposure was unintended</span><i aria-hidden="true">→</i><strong>${a.valueActive+a.sizeActive>1e-9&&m.active>1e-9?'Possible luck; not proof of skill':'Unplanned risk; not the stated strategy'}</strong></div></div>`}<div class="fund-mandate-alpha-note">One period’s residual is not an alpha estimate.</div></article></div>`;

function bankLinkPath(start,end,rail,side){

}

function drawBankBufferLink(){
 const story=$('#bankBufferStory'),buffer=$('#bankLiquidityBuffer'),cost=$('#bankBufferCost'),svg=$('#bankBufferLink');
 if(!story||!buffer||!cost||!svg||typeof story.getBoundingClientRect!=='function')return;
 const box=story.getBoundingClientRect(),from=buffer.getBoundingClientRect(),to=cost.getBoundingClientRect();if(!box.width||!box.height)return;
 const start={x:from.left-box.left-2,y:from.top-box.top+from.height/2},end={x:to.left-box.left-2,y:to.top-box.top+to.height/2};
 let paths=bankConnectionSVG(start,end,8,'buffer');const lock=$('#bankRateLock'),calc=$('#bankFixingCalc');

 V'+n(y(m.realPolicy)+top-12)+' Q692 '+n(y(m.realPolicy)+top)+' 680 '+n(y(m.realPolicy)+top)+' H'+(right+4)+'" marker-end="url(#rh-link-policy-arrow)"/></g>':'';return '<svg class="rh-chart" viewBox="0 0 '+width+' '+(height+top)+'" role="img" aria-labelledby="rh-chart-title rh-chart-desc"><title id="rh-chart-title">Natural real rate and real policy rate: the gap explains the policy stance</title><desc id="rh-chart-desc">Card 1 connects to the white natural real reference, '+sysN(m.rStar)+' percent, at the intersection of saving supply and financing demand. Card 2 connects to the purple dashed real policy rate, '+sysN(m.realPolicy)+' percent, calculated as the ECB nominal rate minus expected inflation. Real policy minus natural is '+sysSigned(gap,1)+' percentage points: '+m.stanceName+'. A positive gap tends to cool demand; a negative gap tends to support demand. The policy line is not a third market-clearing curve.</desc><defs><marker id="rh-link-natural-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" style="fill:#eef5ff;stroke:none"/></marker><marker id="rh-link-policy-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" style="fill:#c1a0ff;stroke:none"/></marker></defs>'+connectors+'<g transform="translate(0,'+top+')"><text x="'+left+'" y="18">Real rate (%)</text>'+[0,2,4,6].map(r=>'<path class="rh-grid" d="M'+left+' '+n(y(r))+' H'+right+'"/><text x="'+(left-13)+'" y="'+n(y(r)+4)+'" text-anchor="end">'+r+'</text>').join('')+'<path class="rh-axis" d="M'+left+' '+(bottom-216)+' V'+bottom+' H'+(right+6)+'"/>'+[0,100,200].map(q=>'<text x="'+n(x(q))+'" y="'+(bottom+19)+'" text-anchor="middle">'+q+'</text>').join('')+'<text x="'+((left+right)/2)+'" y="'+(bottom+42)+'" text-anchor="middle">'+(wide?'Planned financing · illustrative units':'Planned financing')+'</text>'+gapMarkup+'<path class="rh-supply'+(m.scenario==='saving'?' rh-curve-active':'')+'" d="M'+n(x(s0))+' '+n(y(sr(s0)))+' L'+n(x(s1))+' '+n(y(sr(s1)))+'"/><path class="rh-demand'+(['investment','deficit'].includes(m.scenario)?' rh-curve-active':'')+'" d="M'+n(x(d0))+' '+n(y(dr(d0)))+' L'+n(x(d1))+' '+n(y(dr(d1)))+'"/><path class="rh-natural-level" d="M'+left+' '+n(y(m.rStar))+' H'+right+'"/><path class="rh-neutral-guide" d="M'+n(x(m.quantity))+' '+n(y(m.rStar))+' V'+bottom+'"/><path class="rh-policy" d="M'+left+' '+n(y(m.realPolicy))+' H'+right+'"/><circle cx="'+n(x(m.quantity))+'" cy="'+n(y(m.rStar))+'" r="12" class="rh-natural-halo"/><circle cx="'+n(x(m.quantity))+'" cy="'+n(y(m.rStar))+'" r="6" class="rh-equilibrium"/><circle cx="'+n(naturalLabelX+5)+'" cy="'+n(naturalLabelY-4)+'" r="7" class="rh-graph-key-natural"/><text class="rh-graph-key-number rh-key-number-natural" x="'+n(naturalLabelX+5)+'" y="'+n(naturalLabelY-1)+'" text-anchor="middle">1</text><text class="rh-star-label" x="'+n(naturalLabelX+17)+'" y="'+n(naturalLabelY)+'">Natural r* = '+sysN(m.rStar)+'%</text><text class="rh-policy-label" x="'+(right-5)+'" y="'+n(y(m.realPolicy)+(wide||Math.abs(gap)>.5?-10:23))+'" text-anchor="end">② Real policy: '+sysN(m.realPolicy)+'%</text>'+directLabels+'</g></svg>'}


function ratesHubStance(m){const equal=Math.abs(m.stance)<.001,relation=equal?'=':m.stance>0?'&gt;':'&lt;',cases=[['Restrictive','Real rate &gt; r*','Tends to cool demand'],['Neutral','Real rate = r*','Neither stimulates nor restrains'],['Accommodative','Real rate &lt; r*','Tends to support demand']];return '<div class="rh-policy-comparison" aria-label="Compare the real policy rate with the natural real rate"><div class="rh-stance"><strong>'+sysN(m.realPolicy)+'% real '+relation+' '+sysN(m.rStar)+'% natural</strong><span>Gap = real policy rate − natural rate</span></div><ul class="rh-stance-cases">'+cases.map(([name,test,effect])=>'<li data-active="'+(name===m.stanceName)+'"><small>'+test+'</small><strong>'+name+'</strong><span>'+effect+'</span></li>').join('')+'</ul></div>'}
function ratesHubChoice(key,items){return '<div class="rh-choices" role="group" aria-label="'+(key==='policy'?'Illustrative ECB nominal rate':'Saving and financing scenario')+'">'+items.map(([v,label])=>'<button data-rates-key="'+key+'" data-rates-value="'+v+'" aria-pressed="'+(String(ratesHubState[key])===String(v))+'">'+label+'</button>').join('')+'</div>'}
function ratesHubActor(id,title,subtitle,extra=''){return '<button class="rh-actor '+extra+'" data-rates-node="'+id+'"><strong>'+title+' ↗</strong><small>'+subtitle+'</small></button>'}
function ratesHubParticipantLinks(){const button=(id,kind,title,role)=>'<button class="rh-participant rh-participant-'+kind+(ratesHubState.focus===kind?' rh-focus':'')+'" data-rates-node="'+id+'"><strong>'+title+' <b aria-hidden="true">↗</b></strong><small>'+role+'</small></button>';return '<nav class="rh-card-links rh-participant-links" aria-label="How participants connect to interest rates"><div class="rh-context-lane rh-context-natural"><span class="rh-context-label"><b>Natural rate · r*</b><i aria-hidden="true">↔</i></span><div>'+button('households','supply','Households','Saving ↔ consumption')+button('firms','demand','Companies','Investment demand')+button('state','demand','Government','Deficit · net borrowing')+'</div></div><div class="rh-context-lane rh-context-policy"><span class="rh-context-label"><b>Real policy rate</b><i aria-hidden="true">←</i></span><div>'+button('cb','policy','ECB','Policy decisions')+'</div></div><div class="rh-context-lane rh-context-pricing"><span class="rh-context-label"><b>Market pricing</b><i aria-hidden="true">→</i></span><div>'+button('banks','pricing','Banks','Loan pricing')+button('funds','pricing','Funds','Allocation · performance')+'</div></div></nav>'}
function ratesHubPanel(){const m=ratesHubModel(),origin=ratesHubState.origin,names={households:'Households',banks:'Banks',firms:'Companies',government:'Government',state:'Government',cb:'ECB',funds:'Funds',equities:'Equities',bonds:'Bonds'},back=origin&&names[origin.node]?'<button class="rh-back" data-rates-return>← '+names[origin.node]+'</button>':'';return '<div class="rh-panel-content rh-clean-panel" data-rates-focus="'+ratesHubState.focus+'" data-rates-highlight="'+(ratesHubState.highlight||'')+'"><div class="rh-heading"><h3><span class="rh-title-full">Saving → rates → required returns</span><span class="rh-title-short">Interest rates</span></h3>'+back+'<button class="rh-jump" data-rates-jump=".rh-pricing-story">Returns ↓</button><button id="ratesHubClose" aria-label="Close interest-rate overview">×</button></div><div class="rh-rate-guide rh-two-rates" aria-label="Natural real rate compared with the real policy rate"><section class="rh-rate-definition rh-rate-neutral"><h4><span class="rh-rate-key rh-key-natural" aria-hidden="true">1</span> Natural real rate · r* <small>Estimated · not directly observed</small></h4><strong class="rh-rate-number">'+sysN(m.rStar)+'%</strong><p>Flexible-price equilibrium at potential output.</p><div class="rh-scenario-controls"><small>What shifts r*?</small>'+ratesHubChoice('scenario',[['base','Base'],['saving','More saving'],['investment','More investment']])+'</div></section><section class="rh-rate-definition rh-rate-real"><h4><span class="rh-rate-key rh-key-policy" aria-hidden="true">2</span> Real policy rate <small>ECB nominal rate − expected inflation</small></h4><strong class="rh-rate-number">≈ '+sysN(m.realPolicy)+'%</strong><p class="rh-two-rate-calculation">'+sysN(m.policy)+'% ECB nominal − '+sysN(m.expectedInflation)+'% expected inflation</p><div class="rh-inline-policy-control"><small>ECB nominal rate</small>'+ratesHubChoice('policy',[-2,0,2].map(g=>[m.rStar+m.expectedInflation+g,sysN(m.rStar+m.expectedInflation+g)+'%']))+'</div></section></div><div class="rh-single-plot">'+ratesHubChart(m)+'</div>'+ratesHubStance(m)+'<div class="rh-story-down" aria-hidden="true">↓</div>'+fundsRequiredReturnFoundation()+ratesHubParticipantLinks()+'<small class="rh-scope">Illustrative plans at potential output.</small></div>'}

function ratesMapBridge(){
 if(publicationCompactMode())return '';
 const actor=mapFocusActor(),focusLink=actor&&ratesHubConnections().find(l=>l.node===actor),links=actor?[{node:actor,kind:focusLink.kind,path:['banks','funds'].includes(actor)?'M590 107 V393':'M590 393 V107',label:'Rate influences',x:590,y:250,side:'right'}]:ratesHubConnections(),colours={supply:C.rules,demand:C.rules,policy:C.rules,pricing:C.rules},defs=Object.entries(colours).map(([kind,colour])=>'<marker id="rh-context-'+kind+'" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" style="fill:'+colour+';stroke:none"/></marker>').join('');

function updateRatesMapBridge(){const root=$('#ratesBridge');if(root)root.innerHTML=ratesMapBridge();const entry=$('#ratesHubNode');if(entry){entry.innerHTML=ratesMapTile();entry.setAttribute('transform',mapFocusActor()&&!publicationCompactMode()?'translate(0,-330)':'');entry.setAttribute('aria-expanded',String(ratesHubState.open));entry.setAttribute('tabindex',ratesHubState.open?'-1':'0')}const diagram=$('#diagram');if(diagram)diagram.classList.toggle('rates-hub-visible',ratesHubState.open);normaliseMapSpacing();zoom(0)}
function setRatesHubOpen(open,pinned=false){ratesHubState.open=!!open;ratesHubState.pinned=open&&pinned;const root=$('#ratesHub'),panel=$('#ratesHubPanel'),button=$('#ratesHubToggle');if(!root||!panel||!button)return;root.classList.toggle('rh-open',!!open);button.setAttribute('aria-expanded',String(!!open));panel.hidden=!open;if(open){panel.innerHTML=ratesHubPanel();bindRatesHubPanel()}else{panel.innerHTML='';ratesHubState.focus=''}if(open){state.selected=null;state.flow=null;render()}else updateRatesMapBridge()}
function showRatesHub(focus='',anchor='',context={}){
 const fromCard=$('#modal').classList.contains('open');
 if(fromCard)ratesHubState.origin={node:essentialView.id,source:context.source||''};
 else if(!ratesHubState.open)ratesHubState.origin=null;
 ratesHubState.highlight=context.highlight||'';
 if(fromCard)closeModal();
 state.selected=null;state.flow=null;state.zoom=1;
 ratesHubState.focus=['supply','demand','policy','pricing'].includes(focus)?focus:'';
 render();setRatesHubOpen(true,true);publicationSetRoute('rates');
 const root=$('#ratesHub');if(root)root.scrollTop=0;
 const close=$('#ratesHubClose');if(close)close.focus({preventScroll:true});
 const reveal=()=>{if(!ratesHubState.open)return;if(anchor)focusRatesTarget(anchor);else if(root&&publicationCompactMode()&&typeof root.scrollIntoView==='function')root.scrollIntoView({block:'start',behavior:'auto'})};
 reveal();if(publicationCompactMode()&&typeof requestAnimationFrame==='function')requestAnimationFrame(()=>requestAnimationFrame(reveal));
}
function bindRatesHubPanel(){bindSystemLesson();const back=$('[data-rates-return]');if(back)back.onclick=()=>{const origin=ratesHubState.origin;if(!origin)return;setRatesHubOpen(false);selectNode(origin.node);if(origin.source)focusRatesTarget('[data-rates-source="'+origin.source+'"]')};$$('[data-rates-jump]').forEach(button=>button.onclick=()=>focusRatesTarget(button.dataset.ratesJump));$$('[data-rates-key]').forEach(button=>button.onclick=()=>{const key=button.dataset.ratesKey,value=button.dataset.ratesValue;if(key==='policy'){ratesHubState.policy=Number(value);ratesHubState.shortNominal=Number(value)}else if(key==='scenario'&&['base','saving','investment','deficit'].includes(value)){const before=ratesHubModel(),neutralBefore=before.rStar+before.expectedInflation;ratesHubState.scenario=value;const after=ratesHubModel(),delta=after.rStar+after.expectedInflation-neutralBefore;ratesHubState.policy+=delta;ratesHubState.shortNominal+=delta;}ratesHubState.pinned=true;ratesHubState.focus='';$('#ratesHubPanel').innerHTML=ratesHubPanel();bindRatesHubPanel();const fresh=$$('[data-rates-key]').find(b=>b.dataset.ratesKey===key&&b.dataset.ratesValue===value);if(fresh)fresh.focus()});$$('[data-rates-node]').forEach(button=>button.onclick=()=>{setRatesHubOpen(false);focusRatesEntry();selectNode(button.dataset.ratesNode);if(button.dataset.ratesAnchor){const target=$(button.dataset.ratesAnchor);if(target){target.setAttribute('tabindex','-1');target.focus({preventScroll:true});target.scrollIntoView({block:'start',behavior:'auto'})}}});const close=$('#ratesHubClose');if(close)close.onclick=()=>{setRatesHubOpen(false);publicationSetRoute('');focusRatesEntry()}}
function ratesInlineLink(label,focus='pricing',anchor='.rh-pricing-story',highlight='',source=''){return '<button class="rates-inline-link" data-rates-open="'+focus+'" data-rates-anchor="'+anchor+'" data-rates-highlight="'+highlight+'" data-rates-source="'+source+'">'+label+'</button>'}
function focusRatesTarget(anchor){const target=anchor?$(anchor):null;if(!target)return;target.setAttribute('tabindex','-1');target.focus({preventScroll:true});if(typeof target.scrollIntoView!=='function')return;const story=target.closest('.rh-pricing-story');if(story&&target!==story){target.scrollIntoView({block:'nearest',inline:'nearest',behavior:'auto'});story.scrollIntoView({block:'start',inline:'nearest',behavior:'auto'})}else target.scrollIntoView({block:'start',inline:'nearest',behavior:'auto'})}
function bindRatesBridges(){$$('[data-rates-open]').forEach(button=>button.onclick=()=>showRatesHub(button.dataset.ratesOpen,button.dataset.ratesAnchor||'',{highlight:button.dataset.ratesHighlight||'',source:button.dataset.ratesSource||''}))}
function initRatesHub(){const root=$('#ratesHub'),button=$('#ratesHubToggle');if(!root||!button)return;const entry=$('#ratesHubNode');if(entry){entry.onclick=()=>showRatesHub();entry.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showRatesHub()}}}document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ratesHubState.open&&!$('#modal').classList.contains('open')){setRatesHubOpen(false);publicationSetRoute('');focusRatesEntry()}});button.onclick=()=>{if(ratesHubState.open){setRatesHubOpen(false);publicationSetRoute('');focusRatesEntry()}else{setRatesHubOpen(true,true);publicationSetRoute('rates')}};root.onkeydown=e=>{if(e.key==='Escape'&&ratesHubState.open){e.preventDefault();e.stopPropagation();setRatesHubOpen(false);publicationSetRoute('');focusRatesEntry()}}}

function ratesCardBridge(kind){const data={supply:{focus:'supply',label:'HOUSEHOLDS ↔ INTEREST RATES',path:['Saving choices','Saving supply','Natural rate'],caption:'Market real returns feed back into saving and borrowing.'},demand:{focus:'demand',label:'COMPANIES ↔ INTEREST RATES',path:['Investment plans','Financing demand','Natural rate'],caption:'Market required returns feed back into investment and NPV.'},fiscal:{focus:'demand',label:'GOVERNMENT ↔ INTEREST RATES',path:['Deficit','Net borrowing','Financing demand'],caption:'Refinancing replaces debt; maturity and risk also affect yields.'},policy:{focus:'policy',label:'ECB ↔ INTEREST RATES',path:['ECB nominal − expected inflation','Real policy rate','Compare with r*'],caption:'Above r* tends to cool demand; below tends to support it.'},bankPricing:{focus:'pricing',label:'BANKS ↔ INTEREST RATES',path:['ECB policy','Money-market rates','Loan pricing'],caption:'Funding, maturity and risk shape the final quote.'},portfolios:{focus:'pricing',label:'FUNDS ↔ INTEREST RATES',path:['Market rates','Required returns','Portfolio values'],caption:'Expected cash flows, maturity and risk premia also matter.'}}[kind];if(!data)return '';return '<button class="rates-card-bridge rcb-'+kind+'" data-rates-open="'+data.focus+'"><small>'+data.label+' <b aria-hidden="true">↗</b></small><strong class="rcb-path">'+data.path.map((step,i)=>(i?'<i aria-hidden="true">→</i>':'')+'<span>'+step+'</span>').join('')+'</strong><span class="rcb-caption">'+data.caption+'</span></button>'}
